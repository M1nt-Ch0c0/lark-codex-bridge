owners = ["ou_owner_123456", "ou_admin_654321"]
allowed_senders = ["ou_sender_111111"]
allowed_groups = ["oc_group_222222"]

[workspace]
allow_roots = []
network_access = true

[concurrency]
active_turn_permits = 9
max_scope_actors = 31

[codex]
model = "gpt-5.6"
effort = "high"
sandbox = "read-only"
approval_policy = "on-request"

[codex.backend]
mode = "protocol_sidecar"
node_binary = "node"
sidecar_entrypoint = "/opt/lark-codex-bridge/codex-sidecar/index.cjs"

[paths]
database = "state/bridge.sqlite3"
attachment_cache = "cache/attachments"

[asr]
command = "sherpa-onnx-offline"
args = ["--tokens", "/opt/asr/tokens.txt"]
ffmpeg = "ffmpeg"
max_duration_ms = 120000
max_transcript_bytes = 4096
