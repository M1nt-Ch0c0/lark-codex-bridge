name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday 03:17 UTC: re-check advisory/deny data freshness on main.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  shared-server-probe:
    name: Shared server probe safety (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: node --test tools/tests/test_codex_shared_server_probe.mjs

  codex-schema-contracts:
    name: Codex schema contracts (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: codex-schema-contracts
      - run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Reproduce exact Codex schema artifacts
        shell: bash
        run: |
          set -euo pipefail
          for version in 0.146.0 0.149.0; do
            install_root=".codex-ci/$version"
            npm install --prefix "$install_root" --no-audit --no-fund "@openai/codex@$version"
            codex_binary="$install_root/node_modules/.bin/codex"
            if [[ "$RUNNER_OS" == "Windows" ]]; then codex_binary="$codex_binary.cmd"; fi
            python3 tools/codex_schema.py sync \
              --binary "$codex_binary" --check
          done
      - name: Enforce append-only Codex support history
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:protocol/codex/support-history.json"; then
            git show "$BASE_SHA:protocol/codex/support-history.json" > "$RUNNER_TEMP/codex-support-history.json"
            python3 tools/codex_schema.py verify-history --previous "$RUNNER_TEMP/codex-support-history.json"
          else
            python3 tools/codex_schema.py verify
          fi
      - run: python3 tools/codex_schema.py verify
      - run: cargo fetch --locked
      - run: cargo build --offline --locked
      - run: cargo test --offline --locked --test schema_contracts
      - name: Resolve exact native Codex executable
        shell: bash
        run: |
          set -euo pipefail
          native_name=codex
          if [[ "$RUNNER_OS" == "Windows" ]]; then native_name=codex.exe; fi
          codex_binary="$(find "$GITHUB_WORKSPACE/.codex-ci/0.149.0/node_modules/@openai" \
            -type f -path "*/vendor/*/bin/$native_name" -print)"
          if [[ -z "$codex_binary" || "$codex_binary" == *$'\n'* || ! -f "$codex_binary" ]]; then
            echo "expected exactly one native Codex executable" >&2
            exit 1
          fi
          printf 'CODEX_0_149_NATIVE=%s\n' "$codex_binary" >> "$GITHUB_ENV"
      - name: Run exact authenticated external endpoint gate smoke
        shell: bash
        run: |
          set -euo pipefail
          codex_binary="$CODEX_0_149_NATIVE"
          CODEX_EXTERNAL_GATE_E2E=1 \
          CODEX_EXTERNAL_GATE_BINARY="$codex_binary" \
          CODEX_EXTERNAL_GATE_EXPECTED_VERSION=0.149.0 \
            cargo test --locked --test external_endpoint_smoke \
              real_exact_binary_enforces_external_auth_version_and_capability_gate \
              -- --ignored --exact --nocapture
      - name: Run exact authenticated external transport lifecycle smoke
        shell: bash
        run: |
          set -euo pipefail
          codex_binary="$CODEX_0_149_NATIVE"
          CODEX_EXTERNAL_TRANSPORT_E2E=1 \
          CODEX_EXTERNAL_TRANSPORT_BINARY="$codex_binary" \
          CODEX_EXTERNAL_TRANSPORT_EXPECTED_VERSION=0.149.0 \
            cargo test --locked --test external_transport_smoke \
              real_exact_binary_transport_preserves_external_server_across_two_clients_and_fresh_reuse \
              -- --ignored --exact --nocapture
      - name: Run exact external reconciliation restart smoke
        shell: bash
        run: |
          set -euo pipefail
          codex_binary="$CODEX_0_149_NATIVE"
          CODEX_EXTERNAL_RECONCILIATION_E2E=1 \
          CODEX_EXTERNAL_RECONCILIATION_BINARY="$codex_binary" \
          CODEX_EXTERNAL_RECONCILIATION_EXPECTED_VERSION=0.149.0 \
            cargo test --locked --test external_recovery_smoke \
              real_exact_binary_reconciles_across_socket_and_operator_server_restarts_without_write_replay \
              -- --ignored --exact --nocapture
      - name: Run exact external write coordination smoke
        shell: bash
        run: |
          set -euo pipefail
          codex_binary="$CODEX_0_149_NATIVE"
          CODEX_EXTERNAL_WRITE_E2E=1 \
          CODEX_EXTERNAL_WRITE_BINARY="$codex_binary" \
          CODEX_EXTERNAL_WRITE_EXPECTED_VERSION=0.149.0 \
            cargo test --locked --test external_write_smoke \
              real_exact_binary_coordinates_two_clients_queue_exact_ids_and_one_approval_route \
              -- --ignored --exact --nocapture
      - name: Reproduce exact Unix-socket WebSocket contract
        shell: bash
        run: |
          set -euo pipefail
          codex_binary="$CODEX_0_149_NATIVE"
          CODEX_UNIX_WS_E2E=1 \
          CODEX_UNIX_WS_BINARY="$codex_binary" \
          CODEX_UNIX_WS_EXPECTED_VERSION=0.149.0 \
            cargo test --locked --test codex_unix_socket_smoke \
              real_exact_binary_exposes_websocket_framing_and_safe_unix_socket_boundaries \
              -- --ignored --exact --nocapture

  thread-adoption-handoff:
    name: Thread adoption handoff (${{ matrix.os }}, Codex ${{ matrix.codex_version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Issue #4 is intentionally supported only where production can prove
        # process-group absence with a post-wait signal-0 ESRCH check.
        os: [ubuntu-latest, macos-latest]
        codex_version: ["0.149.0", "0.151.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: thread-adoption-handoff-${{ matrix.os }}-${{ matrix.codex_version }}
      - name: Install exact Codex package
        shell: bash
        env:
          CODEX_VERSION: ${{ matrix.codex_version }}
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/thread-adoption-codex-$CODEX_VERSION"
          npm install --prefix "$install_root" --ignore-scripts --no-audit --no-fund \
            --package-lock=false "@openai/codex@$CODEX_VERSION"
          printf 'CODEX_HANDOFF_INSTALL_ROOT=%s\n' "$install_root" >> "$GITHUB_ENV"
      - name: Resolve exact native Codex executable
        shell: bash
        run: |
          set -euo pipefail
          codex_binary="$(find "$CODEX_HANDOFF_INSTALL_ROOT/node_modules/@openai" \
            -type f -path '*/vendor/*/bin/codex' -print)"
          if [[ -z "$codex_binary" || "$codex_binary" == *$'\n'* || ! -x "$codex_binary" ]]; then
            echo "expected exactly one native Codex executable" >&2
            exit 1
          fi
          printf 'CODEX_HANDOFF_NATIVE=%s\n' "$codex_binary" >> "$GITHUB_ENV"
      - name: Run upstream interoperability and archived-resume audit
        shell: bash
        env:
          CODEX_VERSION: ${{ matrix.codex_version }}
        run: |
          set -euo pipefail
          node scripts/thread-adoption-handoff-e2e.cjs \
            --binary "$CODEX_HANDOFF_NATIVE" \
            --expected-version "$CODEX_VERSION"
          node scripts/thread-adoption-handoff-e2e.cjs \
            --audit-archived-resume \
            --binary "$CODEX_HANDOFF_NATIVE" \
            --expected-version "$CODEX_VERSION"
      - name: Run production Router sequential-handoff smoke
        shell: bash
        env:
          CODEX_VERSION: ${{ matrix.codex_version }}
        run: |
          set -euo pipefail
          case "$CODEX_VERSION" in
            0.149.0) backend=spawned-stdio ;;
            0.151.0) backend=protocol-sidecar ;;
            *) echo "unsupported handoff matrix version" >&2; exit 1 ;;
          esac
          CODEX_THREAD_ADOPTION_ROUTER_E2E=1 \
          CODEX_THREAD_ADOPTION_ROUTER_BINARY="$CODEX_HANDOFF_NATIVE" \
          CODEX_THREAD_ADOPTION_ROUTER_EXPECTED_VERSION="$CODEX_VERSION" \
          CODEX_THREAD_ADOPTION_ROUTER_BACKEND="$backend" \
          CODEX_THREAD_ADOPTION_ROUTER_NODE_BINARY="$(command -v node)" \
          CODEX_THREAD_ADOPTION_ROUTER_SIDECAR_ENTRYPOINT="$GITHUB_WORKSPACE/codex-sidecar/index.cjs" \
            cargo test --locked --test thread_adoption_handoff_smoke \
              real_exact_binary_routes_sequential_adoption_without_replacement \
              -- --ignored --exact --nocapture

  fmt:
    name: Format (rustfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: clippy
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (Linux, nextest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-nextest
      - run: cargo nextest run --all-targets --all-features --profile ci --locked -E 'not binary(channel_sidecar)'
      - run: cargo test --test channel_sidecar --locked -- --test-threads=1
      - run: cargo test --doc --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  sidecar:
    name: Node sidecar lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sidecar/package-lock.json
      - run: npm ci --ignore-scripts --prefix sidecar
      - run: npm run check --prefix sidecar

  codex-protocol-sidecar:
    name: Codex protocol sidecar (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "20"
          - os: ubuntu-latest
            node: "22"
          - os: macos-latest
            node: "22"
          - os: windows-latest
            node: "22"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: codex-sidecar/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: codex-protocol-sidecar-${{ matrix.os }}-node-${{ matrix.node }}
      - name: Install the exact sidecar dependency graph without lifecycle scripts
        run: npm ci --ignore-scripts --prefix codex-sidecar
      - name: Verify the sidecar lockfile remains immutable
        run: git diff --exit-code -- codex-sidecar/package-lock.json
      - name: Check and test the Node sidecar
        run: npm run verify --prefix codex-sidecar
      - name: Exercise the real lockfile-pinned Codex lifecycle
        run: npm run ci:smoke --prefix codex-sidecar
      - name: Build the self-contained platform sidecar artifact
        id: build_sidecar
        run: npm run ci:artifact --prefix codex-sidecar
        env:
          CODEX_SIDECAR_ARTIFACT_DIR: ${{ runner.temp }}/codex-sidecar-artifact-node-${{ matrix.node }}
      - name: Upload the immutable platform sidecar artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-sidecar-${{ runner.os }}-${{ runner.arch }}-node-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-sidecar-artifact-node-${{ matrix.node }}/codex-sidecar
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
      - name: Download the platform artifact into an independent directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-sidecar-${{ runner.os }}-${{ runner.arch }}-node-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-sidecar-download-node-${{ matrix.node }}
      - name: Verify and exercise the downloaded artifact without npm or package downloads
        run: node codex-sidecar/ci/real-artifact-smoke.cjs
        env:
          CODEX_SIDECAR_REQUIRE_ARTIFACT: "1"
          CODEX_SIDECAR_RUNTIME_ROOT: ${{ runner.temp }}/codex-sidecar-download-node-${{ matrix.node }}
          CODEX_SIDECAR_EXPECTED_MANIFEST_SHA256: ${{ steps.build_sidecar.outputs.manifest_sha256 }}
      - name: Audit production Node dependencies
        run: npm audit --omit=dev --audit-level=high --prefix codex-sidecar
      - name: Exercise Rust-to-sidecar compatibility and lifecycle contracts
        run: cargo test --locked --test codex_sidecar -- --test-threads=1
        env:
          CODEX_SIDECAR_TEST_REQUIRED: "1"

  docs:
    name: Docs (rustdoc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: docs
      - run: cargo doc --no-deps --all-features --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (Rust 1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv
      - run: cargo check --all-targets --all-features --locked

  build:
    name: Release build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release
      - run: cargo build --release --locked

  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: coverage
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --all-targets --locked --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          # Public repos upload without a token; set CODECOV_TOKEN for private repos.
          token: ${{ secrets.CODECOV_TOKEN }}

  audit:
    name: Audit (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  deny:
    name: Deny (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  machete:
    name: Machete (unused deps)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-machete
      - run: cargo machete

  typos:
    name: Typos (spellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.1
        with:
          config: .typos.toml

  actionlint:
    name: Actionlint (workflow lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  portable:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-nextest
      - name: Exercise portable Codex schema safety boundaries
        run: python -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Verify committed Codex schema artifacts offline
        run: python tools/codex_schema.py verify
      - name: Reproduce exact Codex schema artifacts
        shell: bash
        run: |
          set -euo pipefail
          for version in 0.146.0 0.149.0; do
            install_root=".codex-ci/$version"
            npm install --prefix "$install_root" --no-audit --no-fund "@openai/codex@$version"
            codex_binary="$install_root/node_modules/.bin/codex"
            if [[ "$RUNNER_OS" == "Windows" ]]; then codex_binary="$codex_binary.cmd"; fi
            python tools/codex_schema.py sync \
              --binary "$codex_binary" --check
          done
      - name: Resolve exact native Codex executable
        shell: bash
        run: |
          set -euo pipefail
          native_name=codex
