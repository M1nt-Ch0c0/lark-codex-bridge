[package]
name = "lark-codex-bridge"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "A reliable Rust bridge between Feishu/Lark and Codex app-server"
license = "MIT"
repository = "https://github.com/M1nt-Ch0c0/lark-codex-bridge"
readme = "README.md"
keywords = ["codex", "feishu", "lark", "agent", "bridge"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1.9"
futures-util = "0.3.34"
fs2 = "0.4.3"
libc = "0.2.183"
prost = { version = "0.14.4", default-features = false, features = ["derive", "std"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "multipart", "form"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
secrecy = { version = "0.10.3", features = ["serde"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7.19", features = ["codec", "rt"] }
toml = "1.0.6"
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
